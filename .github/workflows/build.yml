name: Dolphin-AppImage

on: 
  push:

jobs:
  dolphin-appimage:
    name: dolphin bundled as appimage
    runs-on: ubuntu-20.04
    steps:
      # Checks out a copy of your repository on the ubuntu-latest machine
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          repository: noahpistilli/dolphin # dolphin-emu/dolphin
          ref: update-curl # master
          submodules: recursive

      # Runs the Dolphin action
      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        shell: cmake -P {0}
        run: |
          string(TIMESTAMP current_date "%Y-%m-%d-%H;%M;%S" UTC)
          message("::set-output name=timestamp::${current_date}")
      - name: cache
        uses: actions/cache@v3
        with:
          path: ~/.ccache
          key: build-ccache-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
          restore-keys: |
            build-ccache-
      - name: Install Packages
        continue-on-error: true
        id: packages
        run: |
          sudo add-apt-repository -y ppa:okirby/qt6-backports
          sudo apt update
          sudo apt-get install -y dialog libbluetooth-dev liblz4-dev libopus-dev libsystemd-dev extra-cmake-modules liblzo2-dev libxi-dev libavcodec-dev libudev-dev \
          libzip-dev libzstd-dev libasound2-dev libpulse-dev pulseaudio libsfml-dev libminiupnpc-dev libmbedtls-dev libpugixml-dev libxkbcommon-dev libevdev-dev \
          wayland-protocols xwayland libwayland-dev libusb-1.0-0-dev libhidapi-dev libqt6svg6-dev qt6-base-private-dev qt6-base-dev qt6-declarative-dev \
          libfmt-dev libxrandr-dev libglu1-mesa-dev libcurl4-openssl-dev zenity gettext ccache cmake ninja-build libavformat-dev libavdevice-dev adwaita-qt
          find -name qt6
      - name: Install Packages if failed
        id: packages2
        if: steps.packages.outcome=='failure'
        run: |
          sudo add-apt-repository -y ppa:beineri/opt-qt-5.15.2-bionic
          sudo apt-get install -y dialog libbluetooth-dev liblz4-dev libopus-dev libsystemd-dev extra-cmake-modules liblzo2-dev libxi-dev libavcodec-dev libudev-dev \
          libzip-dev libzstd-dev libasound2-dev libpulse-dev pulseaudio libsfml-dev libminiupnpc-dev libmbedtls-dev libpugixml-dev libxkbcommon-dev libevdev-dev \
          qt515base qt5-qmake qt515wayland qtwayland5 wayland-protocols xwayland libwayland-dev libusb-1.0-0-dev libhidapi-dev libqt5waylandclient5-dev qtbase5-private-dev \
          libfmt-dev libxrandr-dev libglu1-mesa-dev libcurl4-openssl-dev zenity gettext ccache cmake ninja-build libavformat-dev libavdevice-dev adwaita-qt \
      - name: Dolphin-Build Number
        run: |
          export LASTCOMMIT=$(git log --pretty=format:%H -1)
          export DOLPHINVER=$(wget -qO- https://dolphin-emu.org/download/dev/${LASTCOMMIT} | grep '<title>' | awk '{print $NF}' | cut -d '<' -f 1)
          echo "DOLPHIN Build $DOLPHINVER"
          echo "DOLPHINVER=$DOLPHINVER" >> $GITHUB_ENV
          sed -i "s|\${DOLPHIN_WC_DESCRIBE}|$DOLPHINVER|g" Source/Core/Common/scmrev.h.in
          cat Source/Core/Common/scmrev.h.in
      - name: Build Dolphin
        run: |
          mkdir -p "$HOME/.ccache"
          echo "Externals" && ls Externals
          export Qt_DIR="/usr/lib/x86_64-linux-gnu/cmake/Qt6"
          export QT_DIR=$Qt_DIR
          mkdir build
          cd build
          cmake .. -GNinja -DENABLE_WAYLAND=1 -DLINUX_LOCAL_DEV=true -DCMAKE_C_COMPILER=/usr/lib/ccache/gcc-10 -DCMAKE_CXX_COMPILER=/usr/lib/ccache/g++-10 -DCMAKE_PREFIX_PATH="${{github.workspace}}/qt/${{ env.yaqti }}/gcc_64/" -DDOLPHIN_WC_DESCRIBE=${DOLPHINVER}
          ninja
          cd $GITHUB_WORKSPACE
      - name: Dolphin Variables
        run: |
          echo ${GITHUB_REF##*/}
          echo ${GITHUB_RUN_ID}
          #TEST ECHOES
          echo "DOLPHIN Build $DOLPHINVER"    
      - name: Package Dolphin-Binary
        run: |
          mkdir -p $GITHUB_WORKSPACE/artifacts
          cp -P build/Binaries/dolphin-emu $GITHUB_WORKSPACE/artifacts
      - name: Package Dolphin-AppImage
        env:
          QT_BASE_DIR: /usr/lib/x86_64-linux-gnu/qt6
          QTDIR: $QT_BASE_DIR
        run: |
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/lib/x86_64-linux-gnu/qt6/
          export PATH=/usr/lib/qt6/bin:$PATH
          echo "PATH $PATH"
          if [[ -e /usr/bin/qmake ]]; then sudo mv /usr/bin/qmake /usr/bin/qmake5; fi
          sudo mv /usr/bin/qmake6 /usr/bin/qmake
          qmake -v
          cd /tmp 
          curl -sSfLO "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -sSfLO "https://github.com/AppImage/AppImageUpdate/releases/download/continuous/AppImageUpdate-x86_64.AppImage"
          chmod a+x linuxdeploy*.AppImage
          chmod a+x AppImageUpdate-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appimage-extract
          curl -sSfL "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage" -o /tmp/squashfs-root/usr/bin/linuxdeploy-plugin-qt.AppImage
          chmod a+x /tmp/squashfs-root/usr/bin/linuxdeploy-plugin-qt.AppImage
          cd $GITHUB_WORKSPACE
          mkdir -p squashfs-root/usr/bin
          cp -P build/Binaries/dolphin-emu $GITHUB_WORKSPACE/squashfs-root/usr/bin/
          cp Data/dolphin-emu.svg ./squashfs-root/dolphin-emu.svg
          cp Data/dolphin-emu.desktop ./squashfs-root/dolphin-emu.desktop
          curl -sSfL https://github.com/AppImage/AppImageKit/releases/download/continuous/runtime-x86_64 -o ./squashfs-root/runtime
          curl -sSfL https://github.com/AppImage/AppImageKit/releases/download/continuous/AppRun-x86_64 -o ./squashfs-root/AppRun
          mkdir -p squashfs-root/usr/share/applications && cp ./squashfs-root/dolphin-emu.desktop ./squashfs-root/usr/share/applications
          mkdir -p squashfs-root/usr/share/icons && cp ./squashfs-root/dolphin-emu.svg ./squashfs-root/usr/share/icons
          mkdir -p squashfs-root/usr/share/icons/hicolor/scalable/apps && cp ./squashfs-root/dolphin-emu.svg ./squashfs-root/usr/share/icons/hicolor/scalable/apps
          mkdir -p squashfs-root/usr/share/pixmaps && cp ./squashfs-root/dolphin-emu.svg ./squashfs-root/usr/share/pixmaps
          mkdir -p squashfs-root/usr/share/dolphin-emu
          cp -R Data/Sys ./squashfs-root/usr/bin
          chmod a+x ./squashfs-root/AppRun
          chmod a+x ./squashfs-root/runtime
          /tmp/squashfs-root/AppRun --appdir="$GITHUB_WORKSPACE"/squashfs-root/ --plugin qt -d "$GITHUB_WORKSPACE"/squashfs-root/dolphin-emu.desktop -i "$GITHUB_WORKSPACE"/squashfs-root/dolphin-emu.svg --exclude-library=libglib* --output appimage
          ls . | grep *.AppImage
          mv $(ls . | grep *.AppImage) $GITHUB_WORKSPACE/artifacts
          ls -al $GITHUB_WORKSPACE/artifacts
        continue-on-error: true  
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: Dolphin_Emulator-x86_64-Linux
          path: artifacts/
